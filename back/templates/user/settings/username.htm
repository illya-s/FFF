{% extends "base/auth.htm" %}
{% load static %}

{% block style %}
<link rel="stylesheet" href="{% static 'css/user/register.css' %}">
{% endblock %}

{% block content %}
<form method="post">
	{% csrf_token %}
	<h2>Обновление никнейма</h2>

	<div class="form-content">
		<input type="text" name="username" value="{{ request.user.username }}">

		<div>
			{% for msg in messages %}
			<p>{{ msg }}</p>
			{% endfor %}
		</div>

		<button type="submit">Сохранить</button>
		<a class="url" href="{% url 'profile' %}">Профиль</a>
	</div>
</form>
{% endblock %}
