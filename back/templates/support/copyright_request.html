{% extends "base/statify.htm" %}
{% load static %}

{% block style %}
<link rel="stylesheet" href="{% static 'css/support/form.css' %}">
{% endblock %}

{% block content %}
<section class="content">
	<form class="main-block" method="post" enctype="multipart/form-data">
		<h1>Обратная связь</h1>

		{% csrf_token %}
		{{ form.as_p }}
		<button type="submit">Отправить</button>
	</form>
</section>
{% endblock %}
